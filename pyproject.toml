[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "dashboard"
version = "0.1.0"
description = "A GTK4/Adwaita based desktop dashboard with weather, media player, clipboard, bluetooth, wifi, and notification widgets."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "PyGObject>=3.42",
    "requests>=2.28",
    "Pillow>=9.0",
    "numpy>=1.23",
    "python-dotenv>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
dashboard = "dashboard:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
